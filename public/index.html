<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Tasks">
<meta name="theme-color" content="#181b21">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Kitchen Tasks — Defrost, Prep &amp; Cleaning</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f2f5; --card:#ffffff; --ink:#15171c; --mut:#666b76; --line:#dde1e8;
  --brand:#181b21; --accent:#252a34; --accent2:#3a4152; --ok:#0f7a4d; --okbg:#e6f6ee;
  --warn:#b0570d; --warnbg:#fdf2e1; --bad:#c0342a; --badbg:#fceded;
  --tap:48px; --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,22,28,.05), 0 10px 24px -14px rgba(20,22,28,.22);
  --font-display:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.48 var(--font-body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:120px;
}
h1,h2,h3,.btn,.tab,.jumpchip,.sec-head h2,table.grid th,.daytitle h2,.mh,.n{font-family:var(--font-display);letter-spacing:-.01em}
input,select,textarea,button{font-family:inherit;font-size:16px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}

/* ---------- header ---------- */
header.app{background:linear-gradient(180deg,#1c2027,var(--brand) 60%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 0;position:sticky;top:0;z-index:40;box-shadow:0 4px 18px rgba(0,0,0,.24)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{height:30px;width:auto;display:block}
.hrow h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.wk{font-size:13px;opacity:.75;margin-left:auto;text-align:right;font-family:var(--font-body)}
.wk b{opacity:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-height:40px;padding:8px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.07);color:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.tab.active{background:#fff;color:var(--brand);border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tab.today::after{content:" •";color:#7dd3fc;font-weight:900}
.tab.active.today::after{color:#2f6fd6}
.tab.done{border-color:#4ade80}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .18s,transform .18s}
@media (hover:hover) and (pointer:fine){
  .card:hover{box-shadow:0 2px 4px rgba(20,22,28,.06), 0 16px 32px -16px rgba(20,22,28,.28);transform:translateY(-1px)}
  .btn:hover{filter:brightness(1.04)}
  .tab:not(.active):hover{background:rgba(255,255,255,.14)}
  .jumpchip:hover{filter:brightness(0.97)}
}
#view.tabswitch{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card[id^="sec-"]{border-left:5px solid var(--sc,var(--line))}
.card[id^="sec-"] .sec-head h2::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc,var(--line));margin-right:9px;vertical-align:middle}
.card[id^="msec-"]{border-left:5px solid var(--sc,var(--line))}
.card[id^="msec-"] .sec-head h2::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sc,var(--line));margin-right:9px;vertical-align:middle}
html{scroll-behavior:smooth}
.jumpnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:12px 0 0;-webkit-overflow-scrolling:touch}
.jumpnav.top{margin-top:0}
.jumpchip{flex:0 0 auto;font-size:13px;font-weight:600;text-decoration:none;border:1px solid;border-radius:999px;padding:7px 14px;white-space:nowrap;transition:transform .1s}
.jumpchip:active{transform:scale(.96)}
.jumpnav.inline{margin:0 0 2px;padding:10px 14px 0}
.jumpnav.inline .jumpchip{font-size:12px;padding:5px 11px}
.sec-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfbfc;flex-wrap:wrap}
.sec-body.closed{display:none}
.sec-toggle{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.sec-head h2{margin:0;font-size:16.5px;font-weight:700}
.prog{margin-left:auto;font-size:13px;color:var(--mut);font-weight:600;font-family:var(--font-body)}
.pad{padding:13px 15px}
.daytitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.daytitle h2{margin:0;font-size:25px;font-weight:700}
.daytitle .dt{color:var(--mut);font-size:14px;font-family:var(--font-body)}

/* ---------- day dot ---------- */
.dotbar{display:flex;align-items:center;gap:10px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0}
.dot{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.dot i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.18)}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;min-width:640px}
table.grid th,table.grid td{padding:9px 8px;border-bottom:1px solid #eceff3;text-align:left;vertical-align:middle}
table.grid th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;color:var(--mut);background:#fafbfc;position:sticky;top:0}
table.grid tbody tr:hover{background:#fafbfd}
table.grid tr.spacer td{height:8px;background:#f7f8fa;padding:0}
td.item{font-weight:600;min-width:170px}
.info{display:inline-block;margin-left:6px;width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:#eaedf5;color:var(--accent2);font-weight:800;font-size:13px;cursor:pointer;vertical-align:middle;font-family:var(--font-display)}
td.uom{color:var(--mut);font-size:13px;white-space:nowrap}
td.lvl{font-weight:700;text-align:center;background:#fafbfc;width:74px}
input.num{width:66px;height:var(--tap);text-align:center;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;font-weight:600;font-size:17px;transition:border-color .15s,box-shadow .15s}
input.num:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(58,65,82,.15)}
td.calc{font-weight:800;text-align:center;font-size:18px;width:110px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:14px;font-weight:700}
.pill.need{background:var(--okbg);color:var(--ok)}
.pill.zero{background:#eef1f5;color:var(--mut)}
.pill.over{background:var(--warnbg);color:var(--warn)}
.pill.trail{background:#0e7490;color:#fff;font-size:11px;padding:3px 9px;margin-left:8px;vertical-align:middle;font-family:var(--font-body)}
.pill.badge{font-size:11px;padding:3px 9px;margin-left:6px;vertical-align:middle;font-family:var(--font-body);font-weight:700}
.pill.shelflife{background:#b45309;color:#fff;font-size:11px;padding:3px 9px;margin-left:6px;vertical-align:middle;font-family:var(--font-body);cursor:pointer;font-weight:700}
.rownote{display:block;font-weight:500;font-size:12px;color:var(--warn);margin-top:2px}

/* ---------- checkboxes ---------- */
.chk{width:28px;height:28px;accent-color:var(--ok)}
td.tick{text-align:center;width:56px}
.ini{width:78px;height:42px;text-align:center;text-transform:uppercase;border:1px solid var(--line);border-radius:var(--radius-sm);font-weight:700}
.stampbox{min-width:90px;text-align:right;flex:0 0 auto}
.stampbox b{display:block;font-size:13px;color:var(--ok);font-family:var(--font-display)}
.stampbox .stamp{display:block;font-size:11px;color:var(--mut);font-weight:600}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-bottom:1px solid #eceff3;transition:background .15s}
.task:last-child{border-bottom:0}
.task.done{background:var(--okbg)}
.task .body{flex:1;min-width:0}
.task .t{font-weight:600}
.task .m{font-size:13px;color:var(--mut);margin-top:2px}
.task .note{font-size:13px;color:var(--warn);margin-top:4px}
.task input[type=checkbox]{margin-top:2px}

/* ---------- banners ---------- */
.banner{border-radius:var(--radius-sm);padding:13px 15px;margin:12px 0;border:1px solid}
.banner.hand{background:#fffbeb;border-color:#fcd34d}
.banner.info{background:#eff5ff;border-color:#bcd1f5}
.banner.good{background:var(--okbg);border-color:#8bd4ae}
.banner.warn{background:var(--badbg);border-color:#f2b3ac}
.banner h3{margin:0 0 6px;font-size:15px}
.banner ul{margin:6px 0 0;padding-left:20px}
.banner li{margin:3px 0}
.noteitem{background:#fff;border:1px solid #fcd34d;border-radius:var(--radius-sm);padding:9px 11px;margin:6px 0}
.metrictiles{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.metrictile{flex:1 1 140px;background:#fafbfc;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 12px;text-align:center}
.metrictile .mval{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--mut)}
.metrictile .mlabel{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.metrictile .mval.st-green{color:#15803d}
.metrictile .mval.st-amber{color:#b45309}
.metrictile .mval.st-red{color:#b91c1c}
.st-select{font-weight:700}
.st-select.st-green{background:#e7f5ec;border-color:#9bd8b1;color:#15803d}
.st-select.st-amber{background:#fef3e2;border-color:#f3c987;color:#b45309}
.st-select.st-red{background:#fbe6ec;border-color:#eda3b7;color:#b91c1c}
.noteitem .meta{font-size:12px;color:var(--mut);margin-top:4px}

/* ---------- forms / buttons ---------- */
textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;resize:vertical;transition:border-color .15s,box-shadow .15s}
input.txt{height:var(--tap);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 12px;width:100%;max-width:260px;transition:border-color .15s,box-shadow .15s}
input.txt:focus,textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(58,65,82,.15)}
.btn{min-height:var(--tap);padding:10px 17px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px -2px rgba(37,42,52,.5)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 2px 8px -2px rgba(15,122,77,.45)}
.btn.danger{background:#fff;border-color:#f0b8b2;color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 13px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.signrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:13px 15px;border-top:1px solid var(--line);background:#fbfbfc}
.signrow label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.stamp{font-size:12px;color:var(--ok);font-weight:700}
.muted{color:var(--mut)}
.small{font-size:13px}
.locked{background:#f3f4f6}

/* ---------- modal ---------- */
.mbg{position:fixed;inset:0;background:rgba(15,17,22,.6);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.mbox{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.mbox .mh{padding:15px;border-bottom:1px solid var(--line);font-weight:700;font-family:var(--font-display)}
.mbox .mb{padding:15px;white-space:pre-wrap}
.mbox .mf{padding:12px 15px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.hide{display:none!important}

/* ---------- user bar ---------- */
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 10px;font-size:13px;color:#fff;opacity:.95}
.userbar b{opacity:1}
.userbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12px;min-height:32px}
.loginnames{display:flex;gap:8px;flex-wrap:wrap}
.loginnames button{min-width:110px;min-height:44px}

/* ---------- archive ---------- */
.arow{display:flex;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid #eceff3;flex-wrap:wrap}
.arow .n{font-weight:700}
.arow .btns{margin-left:auto;display:flex;gap:8px}

@media print{
  header.app,.tabs,.noprint{display:none!important}
  body{background:#fff;padding:0}
  .card{break-inside:avoid;border-color:#999}
  input.num,.ini{border-color:#999}
  .jumpnav{display:none!important}
}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="hrow">
      <div class="brand"><img src="/icons/header-mark.png" alt="" class="brandmark" onerror="this.style.display='none'"><h1 id="appTitle">Kitchen Tasks</h1></div>
      <div class="wk" id="weeklabel"></div>
      <div class="wk" id="syncBadge" style="margin-left:12px;opacity:.85"></div>
      <div style="margin-left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <button type="button" class="btn sm noprint" id="syncNowBtn" title="Pull the latest changes from other devices">&#8635; Sync now</button>
        <span id="appVersion" style="font-size:11px;opacity:.65"></span>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="userbar noprint" id="userBar"></div>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="modal"></div>
<script>
/* =====================================================================
   Kitchen Week — single-file app
   Defrost / Prep / Cleaning sheets, master par table, handover notes,
   weekly archive with download. All data stored on this device.
   ===================================================================== */

var DAYS = [
  {k:'mon', label:'Monday',    short:'Mon', colour:'#2563eb', name:'Blue'},
  {k:'tue', label:'Tuesday',   short:'Tue', colour:'#eab308', name:'Yellow'},
  {k:'wed', label:'Wednesday', short:'Wed', colour:'#dc2626', name:'Red'},
  {k:'thu', label:'Thursday',  short:'Thu', colour:'#92400e', name:'Brown'},
  {k:'fri', label:'Friday',    short:'Fri', colour:'#16a34a', name:'Green'},
  {k:'sat', label:'Saturday',  short:'Sat', colour:'#ea580c', name:'Orange'},
  {k:'sun', label:'Sunday',    short:'Sun', colour:'#111827', name:'Black'}
];
var DK = DAYS.map(function(d){return d.k;});

var SECTIONS = [
  {key:'morning',   label:'Morning cleaning', short:'Morning tasks',           color:'#c2410c', bg:'#fdece3', bd:'#f3b58e'},
  {key:'prep',      label:'Prep',             short:'Prep',                    color:'#0891b2', bg:'#e1f4f8', bd:'#94d3e0'},
  {key:'weekly',    label:'Weekly cleaning',  short:'Todays weekly cleaning',  color:'#7c3aed', bg:'#f0eafd', bd:'#c8b3f6'},
  {key:'defrost',   label:'Defrost',          short:'Defrost',                 color:'#2563eb', bg:'#e7edfd', bd:'#a9bdf5'},
  {key:'closedown', label:'Daily closedown',  short:'Closedown tasks',         color:'#be123c', bg:'#fbe6ec', bd:'#eda3b7'}
];
function toggleBtn(key,open){
  return '<button type="button" class="btn sm noprint sec-toggle" style="margin-left:auto" data-act="toggleSection" data-id="'+key+'">'+(open?'\u25be Hide':'\u25b8 Show')+'</button>';
}
function jumpNav(current,cls){
  var h='<nav class="jumpnav'+(cls?' '+cls:'')+'">';
  SECTIONS.forEach(function(s){
    h+='<a href="#sec-'+s.key+'" class="jumpchip'+(s.key===current?' current':'')+'" style="color:'+(s.key===current?'#fff':s.color)+';background:'+(s.key===current?s.color:s.bg)+';border-color:'+(s.key===current?s.color:s.bd)+'">'+esc(s.short)+'</a>';
  });
  h+='</nav>';
  return h;
}
var ITEM_BADGES={
  rawfish:{label:'Raw Fish', bg:'#2563eb', fg:'#fff'},
  rawmeat:{label:'Raw Meat', bg:'#c0342a', fg:'#fff'},
  cookedmeat:{label:'Cooked Meat', bg:'#eab308', fg:'#3f2d03'},
  wash:{label:'Wash Before Use', bg:'#78350f', fg:'#fff'},
  rawtocooked:{label:'Raw \u2192 Cooked', gradient:'linear-gradient(90deg,#c0342a 0%,#eab308 100%)', fg:'#fff'},
  cookcool:{label:'75\u00b0C \u2192 7\u00b0C / 90min', bg:'#7e22ce', fg:'#fff'}
};
var MASTER_SECTIONS = [
  {key:'morning',  label:'Morning',  color:'#c2410c', bg:'#fdece3', bd:'#f3b58e', full:true},
  {key:'sales',    label:'Sales',    color:'#15803d', bg:'#e7f5ec', bd:'#9bd8b1', full:true},
  {key:'prep',     label:'Prep',     color:'#0891b2', bg:'#e1f4f8', bd:'#94d3e0', full:true},
  {key:'weekly',   label:'Weekly',   color:'#7c3aed', bg:'#f0eafd', bd:'#c8b3f6', full:true},
  {key:'defrost',  label:'Defrost',  color:'#2563eb', bg:'#e7edfd', bd:'#a9bdf5', full:true},
  {key:'closedown',label:'Closedown',color:'#be123c', bg:'#fbe6ec', bd:'#eda3b7', full:true},
  {key:'metrics',  label:'Metrics',  color:'#0891b2', bg:'#e1f4f8', bd:'#94d3e0', full:true},
  {key:'users',    label:'Users',    color:'#0f766e', bg:'#e6f5f3', bd:'#8fd0c6', full:false},
  {key:'bookings', label:'Bookings', color:'#b45309', bg:'#fef3e2', bd:'#f3c987', full:false},
  {key:'settings', label:'Advanced', color:'#334155', bg:'#eef1f5', bd:'#c7cfd9', full:true, topOnly:true}
];
function masterJumpNav(current,cls){
  var h='<nav class="jumpnav'+(cls?' '+cls:'')+'">';
  MASTER_SECTIONS.forEach(function(s){
    if(s.full && ui.adminLevel!=='full') return;
    if(s.topOnly && !(ui.adminRole==='km'||ui.adminRole==='gm')) return;
    h+='<a href="#msec-'+s.key+'" class="jumpchip'+(s.key===current?' current':'')+'" style="color:'+(s.key===current?'#fff':s.color)+';background:'+(s.key===current?s.color:s.bg)+';border-color:'+(s.key===current?s.color:s.bd)+'">'+esc(s.label)+'</a>';
  });
  h+='</nav>';
  return h;
}

/* ---------------- default master data ---------------- */
/* levels / targets are [Mon,Tue,Wed,Thu,Fri,Sat,Sun] */
function DEFAULT_MASTER(){ return {
  pin: '1234',
  appTitle: 'Kitchen Tasks',
  kitchenManagers: [{name:'Kitchen Manager', pin:'1234'}],
  generalManagers: [],
  deputyManagers: [],
  kitchenTeamLeaders: [],
  messages: [],
  notices: [],
  users: [],
  dutyManagers: [],
  morningNote: 'Complete before service. Fryers filtered job changes by day — check the day column.',
  morning: [
    {id:'m01', task:'Chargrill', method:'Bars flipped and lowered, surround cleaned, bars put back up'},
    {id:'m02', task:'Meal streams', method:'Spray with oven cleaner, scourer, wipe, rinse'},
    {id:'m03', task:'Canopy', method:'Right hand filters through the dishwasher',
      detail:'Area above and around the chargrill cleaned.', note:'Monday: all filters go through the dishwasher.'},
    {id:'m04', task:'Fryers filtered', byDay:['All','Chip fryer + right meat fryer','All','Veg fryer + left meat fryer','All','All','All'],
      note:'Veg fryer — wedge the oil basket in with scissors or it will slide out.'}
  ],
  defrostNote: 'You must check what is in the whole kitchen, including prepped items.',

/* ---------------- storage ---------------- */
var KEY_MASTER='kw.master', KEY_WEEK='kw.week.', KEY_IDX='kw.archive.index', KEY_ARC='kw.archive.', KEY_CARRY='kw.carry';
var KEY_IMG='kw.img.'; /* prefix for individually-stored photos — see imgCache/resolveImg below */
var RETAIN_DAYS=400;

/* ---- shared sync (Netlify Function + Blobs) ----
   localStorage stays the fast, always-available cache that every read in this
   app uses. On top of it, every write is also pushed to the shared API, and on
   startup we pull the latest copy from the API so this device picks up
   whatever other devices have saved. If the API can't be reached (wifi down,
   not deployed on Netlify, etc.) the app just carries on working from the
   local cache, same as before. */
var API_BASE = '/api/data';
var SITE_KEY = localStorage.getItem('kw.sitekey') || '';
var syncState = 'idle'; /* idle | syncing | synced | offline */

/* ---- app version / update detection ----
   Bump APP_VERSION and public/version.json together on every deploy. The
   number shown in the header is the version this loaded page is running —
   if two devices show different numbers, whichever is lower hasn't picked
   up the latest deploy yet. This matters more than it sounds: pulling data
   from the server (everything above) never changes the JS code that's
   already loaded and running on a device. A code fix landing on Netlify
   does nothing for a tablet that already has the app open — especially as
   a standalone iOS PWA, which has no pull-to-refresh and won't reload on
   its own. So on top of showing the number, this polls a small version
   file and offers a one-tap reload the moment a newer one is deployed. */
var APP_VERSION = '2026-08-16.5';

function apiHeaders(){ var h={'Content-Type':'application/json'}; if(SITE_KEY) h['x-site-key']=SITE_KEY; return h; }
function setSyncState(s){ syncState=s; var b=document.getElementById('syncBadge'); if(b) b.textContent=syncLabel(); }
function syncLabel(){
  if(syncState==='syncing') return 'Syncing…';
  if(syncState==='synced') return 'Synced just now';
  if(syncState==='offline') return 'Saved on this device only';
  return '';
}
/* Every save to a key is chained onto a per-key promise queue, so (a) writes
   to the same key always land on the server in the order they were made
   here, and (b) a pull can wait for "everything already queued for this key"
   to finish landing before it asks the server what the current value is.
   On top of that, writeGen counts every local edit per key. A pull records
   the count for each key before it starts, and after its fetch comes back,
   only applies that key's server value if the count hasn't moved — i.e. no
   new tick happened while the pull's own request was in flight. Without
   this second check, a tick made in the split-second while a poll's fetch
   was already underway could still get read as "before" the tick on the
   server and stomp it locally, even with the chain-waiting above. */
var writeChains = {};
var writeGen = {};
var lastLocalEditAt = 0; /* stamped on every local edit, any key — used by pullFromServer to hold off syncing during a burst of active ticking */
function apiSet(key,value){
  setSyncState('syncing');
  writeGen[key] = (writeGen[key]||0) + 1;
  lastLocalEditAt = Date.now();
  var queued = (writeChains[key]||Promise.resolve()).then(function(){
    return fetch(API_BASE,{method:'POST',headers:apiHeaders(),body:JSON.stringify({key:key,value:value})})
      .then(function(r){ setSyncState(r.ok?'synced':'offline'); return r.ok; })
      .catch(function(){ setSyncState('offline'); return false; });
  });
  writeChains[key] = queued.catch(function(){}); /* keep the chain alive even if a write fails, so later writes still queue correctly */
  return queued;
}
function pendingWrite(key){ return writeChains[key]||Promise.resolve(); }
function apiGet(key){
  return fetch(API_BASE+'?key='+encodeURIComponent(key),{headers:apiHeaders()})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ return d.value===undefined?null:d.value; })
    .catch(function(){ return undefined; }); /* undefined = could not reach the server, distinct from null = not saved yet */
}
/* Waits for any save already queued for this key, then fetches — so a pull
   never reads a value that's about to be overwritten by our own in-flight
   edit. */
function apiGetFresh(key){ return pendingWrite(key).then(function(){ return apiGet(key); }); }
function apiList(prefix){
  return fetch(API_BASE+'?prefix='+encodeURIComponent(prefix||''),{headers:apiHeaders()})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ return d.keys||[]; })
    .catch(function(){ return null; });
}
function apiDelete(key){ return fetch(API_BASE,{method:'POST',headers:apiHeaders(),body:JSON.stringify({key:key,action:'delete'})}).catch(function(){}); }

/* ---- photo storage ----
   An item's .img field holds EITHER a legacy inline "data:image/..." string
   (old photos, saved directly into the master record) OR a reference like
   "kw.img.d1699999" pointing at its own separate key. Keeping master light
   matters because the whole record is what every device re-syncs every ~20s
   — a reference is a few bytes; an embedded photo can be tens of KB. New
   photos are always saved as references; resolveImg transparently handles
   both forms so nothing breaks for photos saved before this change. */
function isImgRef(v){ return typeof v==='string' && v.indexOf(KEY_IMG)===0; }
var imgCache = {};
function resolveImg(ref, cb){
  if(!ref) return cb('');
  if(!isImgRef(ref)) return cb(ref); /* legacy inline data URL — already the actual image */
  if(imgCache[ref]!==undefined) return cb(imgCache[ref]);
  apiGet(ref).then(function(v){ imgCache[ref]=v||''; cb(imgCache[ref]); });
}
/* After any render(), swap real image data into the placeholders once it's
   fetched — thumbnails show instantly for legacy/cached photos and pop in
   a moment later for anything freshly resolved. */
function resolvePendingThumbs(){
  document.querySelectorAll('img[data-imgref]').forEach(function(im){
    var ref=im.getAttribute('data-imgref');
    resolveImg(ref,function(dataUrl){ if(dataUrl) im.src=dataUrl; im.removeAttribute('data-imgref'); });
  });
}


function lsGet(k,fb){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):fb;}catch(e){return fb;} }
function lsSetLocal(k,v){ try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){alert('Could not save — device storage may be full. Archive and download an old week to free space.');return false;} }
function lsSet(k,v){ var ok=lsSetLocal(k,v); apiSet(k,v); return ok; }
function lsDelete(k){ try{localStorage.removeItem(k);}catch(e){} apiDelete(k); }

function ensureMasterDefaults(){
  var d=DEFAULT_MASTER(),ch=false;
  for(var k in d){ if(!(k in master)){ master[k]=d[k]; ch=true; } }
  /* migrate weekly cleaning items from plain strings to {text,note} if this master was saved before that change */
  for(var wk in master.weekly){
    master.weekly[wk]=(master.weekly[wk]||[]).map(function(item){
      if(typeof item==='string'){ ch=true; return {text:item,note:''}; }
      return item;
    });
  }
  return ch;
}

var master = lsGet(KEY_MASTER,null);
if(!master){ master = DEFAULT_MASTER(); lsSetLocal(KEY_MASTER,master); }
if(ensureMasterDefaults()) lsSetLocal(KEY_MASTER,master);
(function migrateAdminPin(){
  /* sites set up before named Kitchen/General Managers existed just had a
     single shared master.pin — carry it forward as a named Kitchen Manager
     so nobody gets locked out of a site that's already in use. */
  if((!master.kitchenManagers||!master.kitchenManagers.length) && master.pin){
    master.kitchenManagers=[{name:'Kitchen Manager', pin:master.pin}];
    lsSetLocal(KEY_MASTER,master);
  }
})();

/* ---------------- who's logged in on this tablet ----------------
   This is deliberately device-local, not synced to the shared database —
   each tablet remembers its own person until someone taps "Switch user". */
var KEY_SESSION='kw.session';
function sessionGet(){ try{var v=localStorage.getItem(KEY_SESSION); return v?JSON.parse(v):null;}catch(e){return null;} }
function sessionSet(u){ try{localStorage.setItem(KEY_SESSION,JSON.stringify(u));}catch(e){} }
function sessionClear(){ try{localStorage.removeItem(KEY_SESSION);}catch(e){} }
var session = sessionGet(); /* {name:'Alex', at:'...'} or null */
var msgManagerName = null; /* set once a manager PIN unlocks the Messages-tab composer; resets on reload */
var pendingLogin = null;
var pendingLoginList = null;
function staffLoginList(){
  return (master.users||[]).concat(master.kitchenManagers||[]).concat(master.generalManagers||[]).concat(master.deputyManagers||[]).concat(master.kitchenTeamLeaders||[]);
}

function renderUserBar(){
  var b=el('userBar'); if(!b) return;
  if(session){ b.innerHTML='<button data-act="clockOut">Switch user</button><span>On shift: <b>'+esc(session.name)+'</b></span>'; }
  else { b.innerHTML='<button data-act="clockIn">Log in</button><span>Not logged in</span>'; }
}
function openLoginModal(onSuccess){
  pendingLogin=onSuccess;
  var users=staffLoginList();
  pendingLoginList=users;
  if(!users.length){
    showModal('Log in','<p>No staff have been set up yet. Ask a manager to add staff under <b>Settings \u2192 Users</b>, then try again.</p>');
    return;
  }
  var h='<div class="loginnames">';
  users.forEach(function(u,i){ h+='<button class="btn" data-loginname="'+i+'">'+esc(u.name)+'</button>'; });
  h+='</div><div id="loginPinArea" style="margin-top:14px"></div>';
  showModal('Who are you?',h);
}
function showLoginPin(idx){
  var u=(pendingLoginList||[])[idx]; if(!u) return;
  var area=el('loginPinArea'); if(!area) return;
  area.innerHTML='<div class="row"><input class="txt" id="loginPin" type="password" autocomplete="off" maxlength="4" placeholder="PIN" onfocus="this.select()" style="max-width:140px">'+
    '<button class="btn primary" data-act="loginSubmit" data-uidx="'+idx+'">Sign in</button></div>';
  var pinEl=el('loginPin');
  if(pinEl){ pinEl.focus(); pinEl.addEventListener('keydown',function(ev){ if(ev.key==='Enter') doLogin(idx); }); }
}
function doLogin(idx){
  var u=(pendingLoginList||[])[idx]; if(!u) return;
  var pinEl=el('loginPin'); if(!pinEl) return;
  if(pinEl.value!==String(u.pin)){ alert('Wrong PIN.'); pinEl.value=''; pinEl.focus(); return; }
  session={name:u.name,at:stamp()}; sessionSet(session);
  closeModal(); renderUserBar();
  var cb=pendingLogin; pendingLogin=null;
  if(cb) cb();
  deliverMessagesFor(u.name);
}
function requireUser(cb){
  if(session){ cb(); return; }
  openLoginModal(cb);
}

/* ---------------- dates ---------------- */
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=x.getDay(); var diff=(w===0?-6:1-w); x.setDate(x.getDate()+diff); return x; }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function niceDate(d){ return DAYS[(d.getDay()+6)%7].label+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear(); }
function shortDate(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function stamp(){ var n=new Date(); return iso(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes()); }
function todayIdx(){ return (new Date().getDay()+6)%7; }

/* ---------------- week state ---------------- */
function blankDay(){ return {morning:{},defrost:{},defrostBy:{ini:'',at:''},prep:{},weekly:{},closedown:{},temp:'',chef:{ini:'',at:''},dm:{ini:'',at:''},notes:[],ack:null,closed:false,closedAt:'',salesActual:null}; }
function blankWeek(ws){ var w={weekStart:iso(ws),created:stamp(),days:{}}; DK.forEach(function(k){ w.days[k]=blankDay(); }); return w; }

var weekStart = mondayOf(new Date());
var weekKey = iso(weekStart);
var week = lsGet(KEY_WEEK+weekKey,null);
if(!week){ week = blankWeek(weekStart); lsSetLocal(KEY_WEEK+weekKey,week); }
var carry = lsGet(KEY_CARRY,null); /* {from:'2026-07-26', notes:[], open:[] } handed to Monday */

function saveWeek(){ lsSet(KEY_WEEK+weekKey,week); }
function saveMaster(){ lsSet(KEY_MASTER,master); }

/* find any earlier un-archived weeks still sitting in storage */
function strayWeeks(){
  var out=[];
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k && k.indexOf(KEY_WEEK)===0){ var wk=k.slice(KEY_WEEK.length); if(wk!==weekKey) out.push(wk); } }
  return out.sort();
}

function num(v){ if(v===''||v===null||v===undefined) return 0; var n=parseFloat(v); return isNaN(n)?0:n; }

function fmtDateShort(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return ''; var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; var mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return days[d.getDay()]+' '+d.getDate()+' '+mons[d.getMonth()]; }

function openTasksFor(dk){
  /* Only unfinished weekly cleaning jobs carry into the next day's handover.
     Prep, defrost and daily closedown are same-day jobs and don't roll over. */
  var st=week.days[dk], out=[];
  (master.weekly[dk]||[]).forEach(function(t,i){ var r=st.weekly[i]||{}; if(!r.done) out.push('Weekly clean: '+t.text); });
  return out;
}

function salesHeaderBadge(di,st){
  var fc=master.salesForecast[di];
  var act=st.salesActual;
  if(act===null||act===undefined||act===''){
    return '<span class="prog" style="background:#e7f5ec;color:#15803d;border-color:#9bd8b1">Forecast \u00a3'+esc(fc)+'</span>';
  }
  var diff=Math.round(act-fc), pct=fc?Math.round((diff/fc)*1000)/10:0;
  var up=diff>=0;
  return '<span class="prog" style="background:'+(up?'#e7f5ec':'#fbe6ec')+';color:'+(up?'#15803d':'#b91c1c')+';border-color:'+(up?'#9bd8b1':'#eda3b7')+'">Forecast \u00a3'+esc(fc)+' &middot; Actual \u00a3'+esc(act)+' ('+(up?'+':'')+pct+'%)</span>';
}

function statusSelect(dataM, current){
  var opts=[['','\u2014'],['green','Green'],['amber','Amber'],['red','Red']];
  var h='<select class="txt st-select st-'+(current||'none')+'" data-m="'+dataM+'">';
  opts.forEach(function(o){ h+='<option value="'+o[0]+'"'+(o[0]===(current||'')?' selected':'')+'>'+o[1]+'</option>'; });
  h+='</select>';
  return h;
}
function numField(dataM,val){ return '<input class="num" inputmode="decimal" style="max-width:90px" data-m="'+dataM+'" value="'+esc(val===null||val===undefined?'':val)+'" placeholder="\u2014">'; }
function txtField(dataM,val,ph){ return '<input class="txt" style="max-width:120px" data-m="'+dataM+'" value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'">'; }
function dateField(dataM,val){ return '<input class="txt" type="date" style="max-width:150px" data-m="'+dataM+'" value="'+esc(val||'')+'">'; }
function vsLy(act,ly){
  if(act===null||act===undefined||ly===null||ly===undefined) return '\u2014';
  var d=Math.round((act-ly)*10)/10;
  return (d>0?'+':'')+d+'%';
}

  else if(ui.tab==='records') v.innerHTML=renderRecords();
  else if(ui.tab==='messages') v.innerHTML=renderMessagesView();
  else if(ui.tab==='changepin') v.innerHTML=renderChangePinView();
  else v.innerHTML=renderDay(ui.tab);

  applyScrollOffset();

}
function applyScrollOffset(){
  var hdr=document.querySelector('header.app');
  if(!hdr) return;
  var offset=hdr.offsetHeight+10;
  document.querySelectorAll('[id^="sec-"]').forEach(function(elm){ elm.style.scrollMarginTop=offset+'px'; });
}
window.addEventListener('resize',applyScrollOffset);
function sectionCounts(dk,st){
  var di=DK.indexOf(dk);
  var dOut=0,dNeed=0;
  master.defrost.forEach(function(it){ var r=st.defrost[it.id]||{}; var need=num(it.lv[di])-(num(r.on)+num(r.bk));
    if(need>0){ dNeed++; if(r.out) dOut++; } });
  var md=0; (master.morning||[]).forEach(function(mi){ if(((st.morning||{})[mi.id]||{}).done) md++; });
  var pd=0; master.prep.forEach(function(p){ if((st.prep[p.id]||{}).done) pd++; });
  var wl=master.weekly[dk]||[], wd=0; wl.forEach(function(t,i){ if((st.weekly[i]||{}).done) wd++; });
  var cd=0; master.closedown.forEach(function(c){ if((st.closedown[c.id]||{}).done) cd++; });
  return {
    morning:{done:md,total:(master.morning||[]).length},
    prep:{done:pd,total:master.prep.length},
    weekly:{done:wd,total:wl.length},
    defrost:{done:dOut,total:dNeed},
    closedown:{done:cd,total:master.closedown.length}
  };
}
function sectionComplete(key,counts){ var c=counts[key]; return !!(c&&c.total>0&&c.done>=c.total); }
function isSectionOpen(key,complete){
  var ov=ui.collapsed[key];
  if(ov===true) return false;
  if(ov===false) return true;
  return !complete;
}
function updateProgress(){
  if(ui.tab==='master'||ui.tab==='records'||ui.tab==='messages'||ui.tab==='changepin') return;
  var dk=ui.tab, st=week.days[dk];
  var c=sectionCounts(dk,st);
  if(el('pMorning')) el('pMorning').textContent = c.morning.done+' of '+c.morning.total+' done';
  if(el('pDefrost')) el('pDefrost').textContent = c.defrost.total? (c.defrost.done+' of '+c.defrost.total+' pulled') : 'nothing to pull';
  if(el('pPrep'))    el('pPrep').textContent    = c.prep.done+' of '+c.prep.total+' done';
  if(el('pWeekly'))  el('pWeekly').textContent  = c.weekly.total? (c.weekly.done+' of '+c.weekly.total+' done') : '';
  if(el('pClose'))   el('pClose').textContent   = c.closedown.done+' of '+c.closedown.total+' done';
}

      render();
      var txtEl=el('noticeText'); if(txtEl) txtEl.value=savedTxt;
    }, function(){ alert('Could not read that photo — try a different one.'); });
  }
});

function compressImageFile(file,cb,onerr){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxDim=820, w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.55));
    };
    img.onerror=onerr;
    img.src=e.target.result;
  };
  reader.onerror=onerr;
  reader.readAsDataURL(file);
}
function itemForImg(list,r){
  if(list==='d') return master.defrost[r];
  if(list==='p') return master.prep[r];
  if(list==='mo') return master.morning[r];
  if(list==='c') return master.closedown[r];
  if(list==='w'){ var wp=String(r).split(':'); return (master.weekly[wp[0]]||[])[wp[1]]; }
  return null;
}
function itemStableId(list,r){
  if(list==='w') return 'w.'+r;
  var it=itemForImg(list,r);
  return it && it.id;
}
function setItemImg(list,r,val){ var it=itemForImg(list,r); if(it) it.img=val; }
function clearItemImg(list,r){
  var it=itemForImg(list,r);
  if(it && isImgRef(it.img)) apiDelete(it.img); /* free the old photo's own storage slot, not just the reference to it */
  if(it) delete it.img;
}
function countLegacyPhotos(){
  var n=0;
  function chk(it){ if(it && it.img && !isImgRef(it.img)) n++; }
  (master.defrost||[]).forEach(chk);
  (master.prep||[]).forEach(chk);
  (master.morning||[]).forEach(chk);
  (master.closedown||[]).forEach(chk);
  Object.keys(master.weekly||{}).forEach(function(dk){ (master.weekly[dk]||[]).forEach(chk); });
  return n;
}
function migratePhotos(){
  var pending=[];
  function mv(it,stableId){
    if(it && it.img && !isImgRef(it.img)){
      var key=KEY_IMG+stableId;
      imgCache[key]=it.img;
      pending.push(apiSet(key,it.img));
      it.img=key;
    }
  }
  (master.defrost||[]).forEach(function(it){ mv(it,it.id); });
  (master.prep||[]).forEach(function(it){ mv(it,it.id); });
  (master.morning||[]).forEach(function(it){ mv(it,it.id); });
  (master.closedown||[]).forEach(function(it){ mv(it,it.id); });
  Object.keys(master.weekly||{}).forEach(function(dk){
    (master.weekly[dk]||[]).forEach(function(it,i){ mv(it,'w.'+dk+':'+i); });
  });
  Promise.all(pending).then(function(){ saveMaster(); render(); alert('Photos moved to lighter storage.'); });
}

function handleDayInput(t,f){
  var dk=ui.tab, di=DK.indexOf(dk); if(di<0) return;
  var st=week.days[dk], id=t.getAttribute('data-id');
  if(f==='temp'){ st.temp=t.value; }
  else if(f==='salesActual'){ st.salesActual=t.value===''?null:num(t.value); }
  else if(f.indexOf('m.')===0){
    st.morning=st.morning||{};
    st.morning[id]=st.morning[id]||{};
    if(f==='m.done'){
      st.morning[id].done=t.checked;
      if(t.checked){ st.morning[id].ini=session?session.name:''; st.morning[id].at=stamp(); }
      else { st.morning[id].ini=''; st.morning[id].at=''; }
    }
  }
  else if(f.indexOf('d.')===0){
    st.defrost[id]=st.defrost[id]||{};
    if(f==='d.on') st.defrost[id].on=t.value;
    if(f==='d.bk') st.defrost[id].bk=t.value;
    if(f==='d.out') st.defrost[id].out=t.checked;
    var it=master.defrost.filter(function(x){return x.id===id;})[0];
    if(it){ var need=num(it.lv[di])-(num(st.defrost[id].on)+num(st.defrost[id].bk));
      var cell=document.querySelector('[data-need="'+id+'"]');
      if(cell) cell.innerHTML = need>0?'<span class="pill need">'+fmt(need)+'</span>':(need===0?'<span class="pill zero">ok</span>':'<span class="pill over">'+fmt(-need)+' over</span>'); }
  }
  else if(f.indexOf('p.')===0){
    st.prep[id]=st.prep[id]||{};
    if(f==='p.have') st.prep[id].have=t.value;
    if(f==='p.done'){ st.prep[id].done=t.checked; t.closest('tr'); }
    var p=master.prep.filter(function(x){return x.id===id;})[0];
    if(p&&!p.task){ var mk=num(p.tg[di])-num(st.prep[id].have);
      var c2=document.querySelector('[data-make="'+id+'"]');
      if(c2) c2.innerHTML = mk>0?'<span class="pill need">'+fmt(mk)+'</span>':'<span class="pill zero">ok</span>'; }
  }
  else if(f.indexOf('w.')===0){
    st.weekly[id]=st.weekly[id]||{};
    if(f==='w.done'){
      st.weekly[id].done=t.checked;
      if(t.checked){ st.weekly[id].ini=session?session.name:''; st.weekly[id].at=stamp(); }
      else { st.weekly[id].ini=''; st.weekly[id].at=''; }
    }
  }
  else if(f.indexOf('c.')===0){
    st.closedown[id]=st.closedown[id]||{};
    if(f==='c.done'){
      st.closedown[id].done=t.checked;
      if(t.checked){ st.closedown[id].ini=session?session.name:''; st.closedown[id].at=stamp(); }
      else { st.closedown[id].ini=''; st.closedown[id].at=''; }
    }
  }
  saveWeek(); updateProgress();
}

function showInfo(ref){
  var ci=ref.indexOf(':');
  var kind=ref.slice(0,ci), id=ref.slice(ci+1), title='', body='';
  if(kind==='d'){ var it=master.defrost.filter(function(x){return x.id===id;})[0]; if(!it) return;
    title=it.name; body='<b>How to count:</b> '+esc(it.uom)+(it.note?'<br><br>'+esc(it.note):'')+imgTag(it.img); }
  if(kind==='s'){ var it3=master.defrost.filter(function(x){return x.id===id;})[0]; if(!it3) return;
    var days=num(it3.shelfLifeDays);
    var di3=DK.indexOf(ui.tab);
    var dt3=di3>=0?addDays(weekStart,di3):new Date();
    var useBy=addDays(dt3,Math.max(days-1,0));
    title=it3.name+' \u2014 shelf life';
    body='<p style="margin:0 0 12px">Gets '+days+' day'+(days===1?'':'s')+' total from being taken out (that day counts as day one) \u2014 different from the usual day-dot system.</p>'+
         '<p style="margin:0"><b>Taken out:</b> '+esc(shortDate(dt3))+'<br><b>Use by:</b> '+esc(shortDate(useBy))+'</p>'; }
  if(kind==='p'){ var p=master.prep.filter(function(x){return x.id===id;})[0]; if(!p) return;
    title=p.name; body='<b>Unit:</b> '+esc(p.uom)+(p.detail?'<br><br>'+esc(p.detail):'')+imgTag(p.img); }
  if(kind==='ps'){ var p2=master.prep.filter(function(x){return x.id===id;})[0]; if(!p2) return;
    var pdays=num(p2.shelfLifeDays);
    var pdi=DK.indexOf(ui.tab);
    var pdt=pdi>=0?addDays(weekStart,pdi):new Date();
    var pUseBy=addDays(pdt,Math.max(pdays-1,0));
    title=p2.name+' \u2014 shelf life';
    body='<p style="margin:0 0 12px">Gets '+pdays+' day'+(pdays===1?'':'s')+' total once prepped (that day counts as day one).</p>'+
         '<p style="margin:0"><b>Made:</b> '+esc(shortDate(pdt))+'<br><b>Use by:</b> '+esc(shortDate(pUseBy))+'</p>'; }
  if(kind==='m'){ var mi=master.morning.filter(function(x){return x.id===id;})[0]; if(!mi) return;
    title=mi.task; body=(mi.detail?esc(mi.detail):'')+(mi.note?'<br><br><b>Note:</b> '+esc(mi.note):'')+imgTag(mi.img); }
  if(kind==='w'){ var dk2=ui.tab, wi=(master.weekly[dk2]||[])[parseInt(id,10)]; if(!wi) return;
    title=wi.text; body=(wi.note?'<b>Note:</b> '+esc(wi.note):'')+imgTag(wi.img); }
  if(kind==='c'){ var c=master.closedown.filter(function(x){return x.id===id;})[0]; if(!c) return;
    title=c.task; body=(c.method?'<b>Method:</b> '+esc(c.method):'')+(c.detail?'<br><br>'+esc(c.detail):'')+(c.note?'<br><br><b>Note:</b> '+esc(c.note):'')+imgTag(c.img); }
  showModal(title,body);
  resolvePendingThumbs(); /* modal's own image (if any) is a fresh placeholder — resolve it same as any thumbnail */
}
function imgTag(src){
  if(!src) return '';
  if(isImgRef(src)) return '<div style="margin-top:12px"><img data-imgref="'+esc(src)+'" style="max-width:100%;min-height:80px;border-radius:10px;display:block;background:#f1f3f5"></div>';
  return '<div style="margin-top:12px"><img src="'+src+'" style="max-width:100%;border-radius:10px;display:block"></div>';
}

/* =====================================================================
   WEEK ROLLOVER + EXPORT
   ===================================================================== */
function fileWeek(wk){
  var w=lsGet(KEY_WEEK+wk,null); if(!w) return;
  var rec={weekKey:wk,at:stamp(),week:w,master:JSON.parse(JSON.stringify(master))};
  lsSet(KEY_ARC+wk,rec);
  var idx=lsGet(KEY_IDX,[]);
  idx=idx.filter(function(a){return a.weekKey!==wk;});
  idx.push({weekKey:wk,label:shortDate(new Date(wk)),at:rec.at});
  idx.sort(function(x,y){return x.weekKey<y.weekKey?-1:1;});
  /* prune anything older than the retention window */
  var cut=addDays(new Date(),-RETAIN_DAYS);
  idx=idx.filter(function(a){
    if(new Date(a.weekKey)<cut){ lsDelete(KEY_ARC+a.weekKey); return false; }
    return true;
  });
  lsSet(KEY_IDX,idx);
  lsDelete(KEY_WEEK+wk);
  return w;
}

function endWeek(){
  if(!confirm('File this week into the records and open a fresh set of sheets?\n\nSunday\u2019s handover notes and anything left unticked will carry into the new Monday.')) return;
  /* offer the download first so there is always a copy off the tablet */
  dl('kitchen-week-'+weekKey+'.csv', weekCsv(week,master), 'text/csv');
  var sun=week.days.sun;
  var handOn={from:weekKey,notes:sun.notes||[],open:openTasksFor('sun')};
  fileWeek(weekKey);
  lsSet(KEY_CARRY,handOn); carry=handOn;
  weekStart=mondayOf(new Date()); 
  if(iso(weekStart)===weekKey){ weekStart=addDays(weekStart,7); }
  weekKey=iso(weekStart);
  week=blankWeek(weekStart); saveWeek();
  ui.tab=DK[todayIdx()]; render();
  alert('New week started, commencing '+shortDate(weekStart)+'.');
}
function restoreWeek(wk){
  var arc=lsGet(KEY_ARC+wk,null);
  if(!arc){ alert('That record could not be found.'); return; }
  var label=shortDate(new Date(wk));
  if(!confirm('Undo and make the week commencing '+label+' the live working week again?\n\nWhatever is currently on the live sheets will be filed into records first, so nothing on there is lost either.')) return;
  if(week && weekKey && weekKey!==wk){ fileWeek(weekKey); }
  week=JSON.parse(JSON.stringify(arc.week));
  weekKey=wk;
  weekStart=new Date(wk);
  lsSet(KEY_WEEK+weekKey,week);
  lsDelete(KEY_ARC+wk);
  var idx=lsGet(KEY_IDX,[]);
  idx=idx.filter(function(a){ return a.weekKey!==wk; });
  lsSet(KEY_IDX,idx);
  ui.tab=DK[todayIdx()];
  render();
  alert('Restored \u2014 week commencing '+label+' is now the live working week.');
}

function csvRow(a){ return a.map(function(v){ v=(v===undefined||v===null)?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; }).join(',')+'\n'; }

function weekCsv(w,ms){
  var out=csvRow(['Week commencing',shortDate(new Date(w.weekStart))]);
  out+=csvRow(['Exported',stamp()]);
  out+='\n';
  out+=csvRow(['Day','Date','Section','Item','Unit','Par','On line / Have','Back up','Needed / To make','Done','Completed by','Note']);
  DK.forEach(function(dk,di){
    var st=w.days[dk], dt=shortDate(addDays(new Date(w.weekStart),di)), dl2=DAYS[di].label;
    (ms.morning||[]).forEach(function(mi){ var r=(st.morning||{})[mi.id]||{}; var ml=mi.byDay?mi.byDay[di]:mi.method;
      out+=csvRow([dl2,dt,'Morning cleaning',mi.task,'','','','','',r.done?'YES':'',r.ini||'',[ml,mi.note].filter(Boolean).join(' — ')]); });
    ms.defrost.forEach(function(it){ var r=st.defrost[it.id]||{}; var need=num(it.lv[di])-(num(r.on)+num(r.bk));
      out+=csvRow([dl2,dt,'Defrost',it.name,it.uom,it.lv[di],r.on,r.bk,fmt(need),r.out?'YES':'',' ',it.note||'']); });
    out+=csvRow([dl2,dt,'Defrost','Defrost completed by','','','','','','',defrostByOf(st).ini,defrostByOf(st).at]);
    ms.prep.forEach(function(p){ var r=st.prep[p.id]||{}; var mk=num(p.tg[di])-num(r.have);
      out+=csvRow([dl2,dt,'Prep',p.name,p.uom,p.tg[di],r.have,'',p.task?'':fmt(mk),r.done?'YES':'','',p.detail||'']); });
    (ms.weekly[dk]||[]).forEach(function(t,i){ var r=st.weekly[i]||{};
      out+=csvRow([dl2,dt,'Weekly cleaning',t.text,'','','','','',r.done?'YES':'',r.ini||'',t.note||'']); });
    ms.closedown.forEach(function(c){ var r=st.closedown[c.id]||{};
      out+=csvRow([dl2,dt,'Closedown',c.task,'','','','','',r.done?'YES':'',r.ini||'',[c.method,c.detail,c.note].filter(Boolean).join(' — ')]); });
    out+=csvRow([dl2,dt,'Closedown',ms.tempQuestion,'','','','','','','',st.temp]);
    out+=csvRow([dl2,dt,'Sign off','Closing chef','','','','','',st.chef.at?'YES':'',st.chef.ini,st.chef.at]);
    out+=csvRow([dl2,dt,'Sign off','Team leader','','','','','',st.dm.at?'YES':'',st.dm.ini,st.dm.at]);
    (st.notes||[]).forEach(function(n){ out+=csvRow([dl2,dt,'Handover note',n.text,'','','','','','',n.by,n.at]); });
    if(st.ack) out+=csvRow([dl2,dt,'Handover','Read & understood','','','','','','YES',st.ack.ini,st.ack.at]);
    out+=csvRow([dl2,dt,'Day status',st.closed?'Marked complete':'Not marked complete','','','','','','','',st.closedAt]);
  });
  return out;
}

function arcSummary(rec){
  var w=rec.week, ms=rec.master, h='';
  DK.forEach(function(dk,di){
    var st=w.days[dk], cd=0, pd=0;
    ms.closedown.forEach(function(c){ if((st.closedown[c.id]||{}).done) cd++; });
    ms.prep.forEach(function(p){ if((st.prep[p.id]||{}).done) pd++; });
    h+='<p><b>'+DAYS[di].label+'</b><br>Defrost by: '+esc(defrostByOf(st).ini||'—')+
       '<br>Prep '+pd+'/'+ms.prep.length+' &middot; Closedown '+cd+'/'+ms.closedown.length+
       '<br>Chef: '+esc(st.chef.ini||'—')+' &middot; Manager: '+esc(st.dm.ini||'—')+
       (st.notes&&st.notes.length? '<br>Handover notes: '+st.notes.length : '')+'</p>';
  });
  return h;
}

/* ---------------- file helpers ---------------- */
function dl(name,text,mime){
  try{
    var b=new Blob([text],{type:mime+';charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },1500);
  }catch(e){ alert('Download failed on this device.'); }
}
function pick(cb){
  var i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=function(){ var f=i.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ cb(String(r.result)); }; r.readAsText(f); };
  i.click();
}

/* ---------------- go ----------------
   Render straight away from whatever is cached on this device so the app is
   never blocked waiting on the network, then quietly pull the latest shared
   copy in the background and re-render if it turns out something changed
   (e.g. another device updated the master pars, or filed the week).

   That first pull alone isn't enough: once a page has loaded, nothing was
   ever pulling again after it. Two tablets open at once would just sit on
   stale data until someone manually reloaded — and on an iPad/iPhone
   installed as a Home Screen app (standalone PWA), there's no browser
   chrome at all, so pull-to-refresh doesn't exist and there's no way to
   force a reload short of deleting and reinstalling the icon. So on top of
   the initial pull, this also: (1) polls quietly on an interval, (2) pulls
   whenever the tab/app becomes visible again (covers switching back to an
   installed iOS PWA after it was backgrounded), and (3) offers a manual
   "Sync now" button in the header for the same standalone-PWA case, since
   there's no other refresh gesture available there. */
render();

var SYNC_POLL_MS = 20000;
var EDIT_GRACE_MS = 2500; /* don't pull from the server for a few seconds after a local edit — closes the timing window (which seems to be wider over iOS wifi than PC/Android) where a pull's own request could still overlap an in-flight save and read stale data */
var syncInFlight = false;
var pullDeferred = false;

function pullFromServer(isManual){
  if(syncInFlight) return Promise.resolve();
  var sinceEdit = Date.now() - lastLocalEditAt;
  if(sinceEdit < EDIT_GRACE_MS){
    if(!pullDeferred){
      pullDeferred = true;
      setTimeout(function(){ pullDeferred=false; pullFromServer(isManual); }, (EDIT_GRACE_MS - sinceEdit) + 100);
    }
    return Promise.resolve();
  }
  syncInFlight = true;
  setSyncState('syncing');
  var kMaster=KEY_MASTER, kWeek=KEY_WEEK+weekKey, kCarry=KEY_CARRY, kIdx=KEY_IDX;
  var genBefore = {};
  genBefore[kMaster]=writeGen[kMaster]||0;
  genBefore[kWeek]=writeGen[kWeek]||0;
  genBefore[kCarry]=writeGen[kCarry]||0;
  genBefore[kIdx]=writeGen[kIdx]||0;
  function stillFresh(k){ return (writeGen[k]||0)===genBefore[k]; } /* false = a new local edit landed while this pull's request was in flight — keep local, don't overwrite it with what we just fetched */
  return Promise.all([apiGetFresh(kMaster), apiGetFresh(kWeek), apiGetFresh(kCarry), apiGetFresh(kIdx)])
    .then(function(res){
      var rMaster=res[0], rWeek=res[1], rCarry=res[2], rIdx=res[3];
      if(rMaster===undefined){ setSyncState('offline'); return; } /* server unreachable — stay on local cache */
      var changed=false;
      if(rMaster && stillFresh(kMaster) && JSON.stringify(rMaster)!==JSON.stringify(master)){ master=rMaster; ensureMasterDefaults(); lsSetLocal(kMaster,master); changed=true; }
      if(rWeek && stillFresh(kWeek) && JSON.stringify(rWeek)!==JSON.stringify(week)){ week=rWeek; lsSetLocal(kWeek,week); changed=true; }
      if(rCarry!==undefined && rCarry!==null && stillFresh(kCarry) && JSON.stringify(rCarry)!==JSON.stringify(carry)){ carry=rCarry; lsSetLocal(kCarry,carry); changed=true; }
      if(rIdx && stillFresh(kIdx)){ lsSetLocal(kIdx,rIdx); }
      setSyncState('synced');
      if(changed) render();
    })
    .catch(function(){ setSyncState('offline'); })
    .then(function(){
      syncInFlight = false;
      if(isManual){
        var btn=document.getElementById('syncNowBtn');
        if(btn){ var old=btn.textContent; btn.textContent='\u2713 Synced'; setTimeout(function(){ btn.textContent=old; },1200); }
      }
    });
}

/* ---- "How are we doing?" metrics ----
   Entered directly in Settings > Business metrics (master.metrics) and
   rendered straight from there \u2014 no external flow or endpoint involved. */

function boot(){ pullFromServer(false); }
boot();

/* keep pulling quietly while the app is open */
setInterval(function(){
  if(document.visibilityState==='visible') pullFromServer(false);
}, SYNC_POLL_MS);

/* catch the case a standalone iOS PWA gets backgrounded and reopened —
   there's no reload here, just this tab becoming visible again */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){ pullFromServer(false); }
});
window.addEventListener('focus', function(){ pullFromServer(false); });
window.addEventListener('pageshow', function(){ pullFromServer(false); });

/* manual fallback — the only "refresh gesture" available once installed as
   a standalone Home Screen app on iOS, where pull-to-refresh doesn't exist */
document.getElementById('syncNowBtn').addEventListener('click', function(){ pullFromServer(true); });

/* version display + update check */
(function(){
  var vEl = document.getElementById('appVersion');
  if(vEl) vEl.textContent = 'v'+APP_VERSION;
})();
function checkForUpdate(){
  fetch('/version.json?ts='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      if(!d || !d.version || d.version===APP_VERSION) return;
      var vEl = document.getElementById('appVersion');
      if(!vEl || vEl.dataset.updateShown) return;
      vEl.dataset.updateShown = '1';
      vEl.innerHTML = 'v'+APP_VERSION+' — <a href="#" id="updateNowLink" style="color:#fff;text-decoration:underline">update to '+d.version+'</a>';
      var link = document.getElementById('updateNowLink');
      if(link) link.addEventListener('click', function(e){ e.preventDefault(); location.reload(); });
    })
    .catch(function(){});
}
checkForUpdate();
setInterval(checkForUpdate, SYNC_POLL_MS*3);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') checkForUpdate(); });
</script>
